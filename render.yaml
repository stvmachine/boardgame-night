# Render Blueprint — boardgame-night (Rails 8.1 + React SPA, Docker, Postgres)
# Docs: https://render.com/docs/blueprint-spec
#
# Production uses Render's managed PostgreSQL (free tier). No persistent disk:
# the DB is Postgres, and Solid Cache/Queue/Cable live in that same database.
# SQLite is development/test only.
databases:
  - name: boardgame-night-db
    plan: free              # free Postgres: expires 30 days after creation — see notes
    databaseName: boardgame_night
    user: boardgame_night

services:
  - type: web
    name: boardgame-night
    runtime: docker
    plan: free              # free web: spins down after ~15 min idle (cold starts)
    region: oregon          # change to your nearest region (e.g. frankfurt, singapore)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeployTrigger: commit

    # Free instances don't support preDeployCommand, so migrations run at startup
    # inside bin/render-start (db:prepare, then Puma). Wrapped in dotenvx so the
    # encrypted .env.bggeek (BGG token + SECRET_KEY_BASE) is decrypted first.
    # The logic lives in a script to avoid shell-quoting pitfalls in YAML.
    dockerCommand: dotenvx run -f .env.bggeek -- bin/render-start

    envVars:
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "1"
      - key: RAILS_SERVE_STATIC_FILES
        value: "true"          # Puma serves the compiled SPA from public/ (no CDN in front)
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"          # run background jobs inside the web process
      # Postgres connection string, injected by Render from the database above.
      - key: DATABASE_URL
        fromDatabase:
          name: boardgame-night-db
          property: connectionString
      # The only manually-set secret. dotenvx uses it to decrypt the committed,
      # encrypted .env.bggeek — which carries the BGG token AND SECRET_KEY_BASE.
      # Set the value (from .env.bggeek.keys) in the dashboard.
      - key: DOTENV_PRIVATE_KEY_BGGEEK
        sync: false
