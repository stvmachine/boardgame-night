mutation ScheduleSession($sessionId: ID!, $scheduledAt: ISO8601DateTime, $location: String, $capacity: Int) {
  scheduleSession(sessionId: $sessionId, scheduledAt: $scheduledAt, location: $location, capacity: $capacity) {
    session {
      id
      title
      description
      state
      scheduledAt
      location
      capacity
      attendeeCount
      host {
        id
        username
        displayName
      }
      group {
        id
        name
      }
    }
    invitesSent
  }
}
