mutation PickGame($sessionId: ID!, $gameId: ID!) {
  pickGame(sessionId: $sessionId, gameId: $gameId) {
    session {
      id
      title
      state
      scheduledAt
      location
      capacity
      attendeeCount
      host {
        id
        displayName
      }
      group {
        id
        name
      }
      attendances {
        id
        response
        user {
          id
          displayName
        }
      }
      pickedGame {
        id
        name
        thumbnail
        yearPublished
        minPlayers
        maxPlayers
        minPlaytime
        maxPlaytime
        average
        averageWeight
        owners {
          bggUsername
          avatar
        }
      }
    }
  }
}
