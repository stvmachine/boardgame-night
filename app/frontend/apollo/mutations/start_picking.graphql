mutation StartPicking($sessionId: ID!) {
  startPicking(sessionId: $sessionId) {
    session {
      id
      title
      state
      scheduledAt
      location
      capacity
      attendeeCount
      host {
        id
        displayName
      }
      group {
        id
        name
      }
      attendances {
        id
        response
        user {
          id
          displayName
        }
      }
      pickedGame {
        id
        name
        thumbnail
      }
    }
  }
}
