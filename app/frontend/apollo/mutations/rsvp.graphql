mutation Rsvp($token: String!, $response: String!, $nickname: String) {
  rsvp(token: $token, response: $response, nickname: $nickname) {
    attendance {
      id
      response
      respondedAt
      user {
        id
        username
        displayName
        isProvisional
      }
    }
    session {
      id
      title
      state
      scheduledAt
      location
      attendeeCount
      host {
        id
        username
        displayName
      }
    }
  }
}
