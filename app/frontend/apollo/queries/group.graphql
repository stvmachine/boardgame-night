query Group($token: String!) {
  group(token: $token) {
    id
    name
    description
    inviteCode
    myRole
    owner {
      id
      username
      displayName
    }
    members {
      id
      username
      displayName
    }
    memberships {
      id
      role
      user {
        id
        username
        displayName
      }
    }
    sessions {
      id
      title
      state
      scheduledAt
      attendeeCount
      attendances {
        id
        response
        user {
          id
          username
          displayName
        }
      }
    }
    pastSessions {
      id
      title
      state
      scheduledAt
      attendeeCount
      pickedGame {
        name
      }
      attendances {
        id
        response
        user {
          id
          username
          displayName
        }
      }
    }
    collectionTotalCount
    collectionSpotlight(limit: 4) {
      id
      objectid
      name
      thumbnail
      average
      owners {
        bggUsername
        avatar
      }
    }
  }
}
