query GroupCollection($token: String!) {
  group(token: $token) {
    id
    name
    description
    inviteCode
    myRole
    owner {
      id
      username
      displayName
    }
    members {
      id
      username
      displayName
      bggUsername
    }
    memberships {
      id
      role
      user {
        id
        username
        displayName
        bggUsername
      }
    }
    collection {
      items {
        id
        objectid
        name
        thumbnail
        yearPublished
        minPlayers
        maxPlayers
        minPlaytime
        maxPlaytime
        average
        averageWeight
        description
        lastPlayedAt
        owners {
          bggUsername
          avatar
        }
      }
      syncStatuses {
        username
        status
        lastSyncedAt
        gameCount
      }
    }
  }
}
