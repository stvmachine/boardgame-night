query NightSession($id: ID!) {
  nightSession(id: $id) {
    id
    title
    description
    state
    scheduledAt
    location
    capacity
    attendeeCount
    host {
      id
      username
      displayName
    }
    group {
      id
      name
      inviteCode
      myRole
      members {
        id
        username
        displayName
      }
    }
    attendances {
      id
      response
      respondedAt
      user {
        id
        username
        displayName
      }
    }
    pickedGame {
      id
      name
      thumbnail
      yearPublished
      minPlayers
      maxPlayers
      minPlaytime
      maxPlaytime
      average
      averageWeight
      owners {
        bggUsername
        avatar
      }
    }
    timeBudgetMinutes
    complexityPreference
    suggestions {
      score
      confidence
      reasons
      thing {
        id
        objectid
        name
        thumbnail
        image
        yearPublished
        minPlayers
        maxPlayers
        minPlaytime
        maxPlaytime
        average
        averageWeight
        description
        owners {
          bggUsername
          avatar
        }
      }
    }
    previousState
  }
}
