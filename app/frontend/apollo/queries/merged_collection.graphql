query MergedCollection($usernames: [String!]!) {
  mergedCollection(usernames: $usernames) {
    items {
      id
      objectid
      name
      yearPublished
      minPlayers
      maxPlayers
      minPlaytime
      maxPlaytime
      minAge
      image
      thumbnail
      description
      average
      bayesAverage
      usersRated
      averageWeight
      isExpansion
      lastPlayedAt
      owners {
        bggUsername
        avatar
      }
    }
    syncStatuses {
      username
      status
      lastSyncedAt
      error
      gameCount
    }
  }
}
