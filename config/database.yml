# Database configuration.
#
# Each environment is a single "primary" database. The Solid Queue/Cache/Cable
# tables live inside it (created by a regular migration), rather than in separate
# databases — this keeps one connection pool per environment and works the same
# on SQLite and PostgreSQL.
#
#   development / test  -> SQLite (local, fast)
#   production          -> PostgreSQL (Render managed, via DATABASE_URL)
#
# The environments do not share configuration across the dev/prod boundary.

# --- SQLite defaults, used by development and test only ----------------------
sqlite: &sqlite
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  primary:
    <<: *sqlite
    database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  primary:
    <<: *sqlite
    database: storage/test.sqlite3

# --- PostgreSQL, production only ---------------------------------------------
# DATABASE_URL is injected by Render. Point a local Postgres here (same env var)
# when you want to run e2e/production-parity checks locally.
production:
  primary:
    adapter: postgresql
    encoding: unicode
    url: <%= ENV["DATABASE_URL"] %>
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
